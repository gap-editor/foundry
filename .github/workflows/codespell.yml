name: Full Repository Spellcheck
on: [push, pull_request]

jobs:
  codespell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Важно: скачиваем всю историю или полный корень
          fetch-depth: 0 

      - name: Run codespell on all files
        uses: codespell-project/actions-codespell@v2
        with:
          # Проверять скрытые файлы (начинающиеся с точки)
          check_hidden: true
          # Проверять имена самих файлов
          check_filenames: true
          # Путь для проверки (точка — весь репозиторий)
          path: .
          # Исключить папки, которые не нужно трогать
          skip: ./.git,./node_modules,./build,*.lock
